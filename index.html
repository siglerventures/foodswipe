<title>FoodSwipe — Philinity</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-size='52'>🌿</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b100c;
    --surface: #121a14;
    --surface2: #18221c;
    --surface3: #1f2b23;
    --sage: #6b9e7f;
    --sage-light: #9fc5a8;
    --sage-dim: #3e5c48;
    --terracotta: #c4704a;
    --terracotta-light: #e08a62;
    --gold: #c9a84c;
    --text: #e8e6d8;
    --text-dim: #9aa594;
    --text-muted: #5a6158;
    --red: #b85c4c;
    --amber: #d4860a;
    --border: #1f2b23;
    --border-sage: #2d4236;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* HEADER */
  header {
    background: linear-gradient(180deg, #141b16 0%, var(--bg) 100%);
    border-bottom: 1px solid var(--border-sage);
    padding: 0 24px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
  }
  .header-inner {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 20px;
    height: 64px;
  }
  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    color: var(--sage-light);
    white-space: nowrap;
    letter-spacing: 0.5px;
    cursor: pointer;
  }
  .logo span { color: var(--gold); font-style: italic; }

  .header-actions {
    margin-left: auto;
    display: flex;
    gap: 8px;
    align-items: center;
  }

  /* SEARCH / AI BAR */
  .search-bar {
    background: linear-gradient(135deg, var(--surface) 0%, #131c16 100%);
    border-bottom: 1px solid var(--border-sage);
    padding: 12px 24px;
  }
  .search-bar-inner {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .bar-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--sage);
    white-space: nowrap;
    font-weight: 500;
    min-width: 70px;
  }
  .unified-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--sage-dim);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    outline: none;
    transition: border-color 0.2s;
  }
  .unified-input:focus { border-color: var(--sage-light); }
  .unified-input::placeholder { color: var(--text-muted); }

  .icon-btn {
    background: transparent;
    border: none;
    font-size: 22px;
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 8px;
    transition: background 0.15s;
    flex-shrink: 0;
    line-height: 1;
    min-width: 44px;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
  }
  .icon-btn:hover { background: var(--surface3); }

  /* FILTER BAR */
  .filter-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border-sage);
    padding: 10px 24px;
  }
  .filter-bar-inner {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .chip {
    background: transparent;
    border: 1px solid var(--border-sage);
    color: var(--text-dim);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .chip:hover { border-color: var(--sage); color: var(--text); }
  .chip.active { background: var(--sage); border-color: var(--sage); color: #0b100c; font-weight: 600; }
  .chip-divider { width: 1px; height: 20px; background: var(--border-sage); margin: 0 4px; }
  .chip-label {
    font-size: 11px;
    color: var(--sage);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* BUTTONS */
  .btn {
    border: 1px solid var(--sage-dim);
    background: var(--surface2);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn:hover { border-color: var(--sage-light); background: var(--surface3); }
  .btn-sage { background: var(--sage); border-color: var(--sage); color: #0b100c; font-weight: 500; }
  .btn-sage:hover { background: var(--sage-light); border-color: var(--sage-light); }
  .btn-ghost { background: transparent; border-color: var(--border-sage); }
  .btn-danger { background: transparent; border-color: var(--red); color: var(--red); }
  .btn-danger:hover { background: rgba(184, 92, 76, 0.1); }

  /* MAIN */
  main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px;
  }

  /* CARDS GRID */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border-sage);
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
  }
  .card:hover { border-color: var(--sage); transform: translateY(-2px); }
  .card-image {
    width: 100%;
    aspect-ratio: 4/3;
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .card-image img { width: 100%; height: 100%; object-fit: cover; }
  .card-image-placeholder {
    font-size: 48px;
    opacity: 0.4;
  }
  .card-body { padding: 14px 16px 16px; flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .card-name {
    font-family: 'Playfair Display', serif;
    font-size: 17px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.25;
  }
  .card-sub { font-size: 12px; color: var(--text-dim); }
  .card-meta {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 8px;
  }
  .badge {
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 10px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    font-weight: 500;
  }
  .badge-have { background: rgba(107, 158, 127, 0.15); color: var(--sage-light); }
  .badge-need { background: rgba(196, 112, 74, 0.15); color: var(--terracotta-light); }
  .badge-dormant { background: rgba(201, 168, 76, 0.15); color: var(--gold); }
  .badge-planted { background: rgba(107, 158, 127, 0.15); color: var(--sage-light); }
  .badge-expiring { background: rgba(184, 92, 76, 0.2); color: #e09080; }
  .badge-category {
    background: var(--surface3);
    color: var(--text-dim);
  }

  .card-top-ribbon {
    position: absolute;
    top: 10px;
    left: 10px;
    display: flex;
    gap: 6px;
  }
  .card-top-right {
    position: absolute;
    top: 10px;
    right: 10px;
  }

  /* STATS BAR */
  .stats-bar {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border-sage);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .stat-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
  .stat-value {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    color: var(--sage-light);
    margin-top: 4px;
  }
  .stat-value.warn { color: var(--terracotta-light); }
  .stat-value.alert { color: #e09080; }

  /* EMPTY STATE */
  .empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-dim);
  }
  .empty-icon { font-size: 56px; margin-bottom: 16px; opacity: 0.5; }
  .empty-title { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--text); margin-bottom: 6px; }
  .empty-sub { font-size: 14px; }

  /* MODAL */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(6px);
    z-index: 200;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px;
    overflow-y: auto;
  }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border-sage);
    border-radius: 14px;
    max-width: 640px;
    width: 100%;
    padding: 28px;
    position: relative;
  }
  .modal-close {
    position: absolute;
    top: 14px;
    right: 14px;
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 22px;
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 6px;
  }
  .modal-close:hover { color: var(--text); background: var(--surface3); }
  .modal-title {
    font-family: 'Playfair Display', serif;
    font-size: 24px;
    color: var(--sage-light);
    margin-bottom: 4px;
  }
  .modal-sub { font-size: 13px; color: var(--text-dim); margin-bottom: 20px; }

  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 11px;
    color: var(--sage);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .field input, .field select, .field textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--sage-dim);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    outline: none;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--sage-light); }
  .field textarea { min-height: 70px; resize: vertical; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .modal-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border-sage);
  }

  /* DETAIL VIEW */
  .detail-meta-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px 20px;
    margin: 16px 0;
  }
  .detail-meta-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
  .detail-meta-value { font-size: 14px; color: var(--text); margin-top: 2px; }
  .detail-meta-value a { color: var(--sage-light); text-decoration: none; word-break: break-all; }
  .detail-meta-value a:hover { text-decoration: underline; }

  .detail-image {
    width: 100%;
    aspect-ratio: 16/10;
    background: var(--surface2);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .detail-image img { width: 100%; height: 100%; object-fit: cover; }
  .detail-image-placeholder { font-size: 72px; opacity: 0.3; }

  /* PHOTO UPLOAD */
  .photo-upload-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 8px;
  }
  .photo-thumb {
    width: 64px;
    height: 64px;
    border-radius: 8px;
    background: var(--surface2);
    border: 1px solid var(--border-sage);
    overflow: hidden;
    position: relative;
  }
  .photo-thumb.is-main {
    border-color: var(--sage-light);
    box-shadow: 0 0 0 2px var(--sage-light);
  }
  .photo-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .photo-thumb-x {
    position: absolute;
    top: 2px;
    right: 2px;
    background: rgba(0,0,0,0.7);
    color: white;
    border: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    font-size: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }
  .photo-thumb-star {
    position: absolute;
    top: 2px;
    left: 2px;
    background: rgba(0,0,0,0.7);
    color: var(--gold);
    border: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    padding: 0;
  }
  .photo-thumb-star:hover { background: rgba(0,0,0,0.9); color: var(--gold); }
  .photo-thumb.is-main .photo-thumb-star { color: var(--gold); }

  /* AI CHAT */
  .ai-panel {
    background: var(--surface);
    border: 1px solid var(--border-sage);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 20px;
    max-height: 400px;
    overflow-y: auto;
  }
  .chat-bubble {
    padding: 10px 14px;
    border-radius: 12px;
    margin-bottom: 8px;
    max-width: 90%;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .chat-bubble.user { background: var(--sage); color: #0b100c; margin-left: auto; border-bottom-right-radius: 4px; }
  .chat-bubble.ai { background: var(--surface2); border: 1px solid var(--border-sage); margin-right: auto; border-bottom-left-radius: 4px; }
  .chat-thinking { font-style: italic; color: var(--text-dim); font-size: 13px; padding: 6px 14px; display: none; }
  .chat-thinking.visible { display: block; }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--surface);
    border: 1px solid var(--sage);
    color: var(--text);
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 14px;
    z-index: 500;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    max-width: 90vw;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { border-color: var(--red); color: #e09080; }

  /* AUTH GATE */
  .auth-gate {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .auth-card {
    background: var(--surface);
    border: 1px solid var(--border-sage);
    border-radius: 14px;
    padding: 36px;
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  .auth-title {
    font-family: 'Playfair Display', serif;
    font-size: 32px;
    color: var(--sage-light);
    margin-bottom: 8px;
  }
  .auth-title span { color: var(--gold); font-style: italic; }
  .auth-sub { font-size: 14px; color: var(--text-dim); margin-bottom: 28px; line-height: 1.6; }

  /* FOOTER */
  footer {
    max-width: 1400px;
    margin: 40px auto 20px;
    padding: 20px 24px;
    text-align: center;
    color: var(--text-muted);
    font-size: 11px;
    border-top: 1px solid var(--border-sage);
  }
  footer span { color: var(--sage); }

  /* MOBILE */
  @media (max-width: 640px) {
    header { padding: 0 16px; }
    .search-bar, .filter-bar, main { padding-left: 16px; padding-right: 16px; }
    .logo { font-size: 18px; }
    .bar-label { display: none; }
    .field-row { grid-template-columns: 1fr; }
    .modal { padding: 20px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
    .stat-value { font-size: 22px; }
  }

  .hidden { display: none !important; }

  /* QUICK-LOG BUTTONS ON CARDS */
  .quick-log-row {
    display: flex;
    gap: 4px;
    padding: 0 12px 12px;
    flex-wrap: wrap;
    border-top: 1px solid var(--border-sage);
    padding-top: 10px;
    margin-top: 6px;
  }
  .quick-log-btn {
    flex: 1 0 auto;
    min-width: 32px;
    background: var(--surface2);
    border: 1px solid var(--border-sage);
    color: var(--text-dim);
    padding: 6px 8px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.15s;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .quick-log-btn:hover {
    background: var(--surface3);
    border-color: var(--sage);
    color: var(--sage-light);
    transform: translateY(-1px);
  }
  .quick-log-btn.diagnose-btn:hover {
    border-color: var(--gold);
    color: var(--gold);
  }
  .quick-log-btn .qlb-label {
    font-size: 10px;
    font-family: 'DM Sans', sans-serif;
    letter-spacing: 0.3px;
  }

  /* TIMELINE */
  .timeline-section {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border-sage);
  }
  .timeline-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .timeline-header h3 {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    color: var(--sage-light);
    font-weight: 500;
  }
  .timeline-actions {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .timeline-action-btn {
    background: var(--surface2);
    border: 1px solid var(--border-sage);
    color: var(--text-dim);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 11px;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .timeline-action-btn:hover {
    background: var(--surface3);
    border-color: var(--sage);
    color: var(--sage-light);
  }
  .timeline-action-btn.diagnose {
    border-color: var(--gold);
    color: var(--gold);
  }
  .timeline-action-btn.diagnose:hover {
    background: rgba(201, 168, 76, 0.12);
  }
  .timeline-list { display: flex; flex-direction: column; gap: 10px; }
  .timeline-entry {
    background: var(--surface2);
    border: 1px solid var(--border-sage);
    border-radius: 10px;
    padding: 12px 14px;
    position: relative;
  }
  .timeline-entry-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 6px;
    gap: 12px;
  }
  .timeline-entry-type {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: var(--sage-light);
    font-weight: 500;
  }
  .timeline-entry-date { font-size: 11px; color: var(--text-muted); white-space: nowrap; }
  .timeline-entry-note {
    font-size: 13px;
    color: var(--text);
    line-height: 1.45;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .timeline-entry-photos {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 8px;
  }
  .timeline-entry-photo {
    width: 60px;
    height: 60px;
    border-radius: 6px;
    object-fit: cover;
    border: 1px solid var(--border-sage);
    cursor: pointer;
  }
  .timeline-entry-diagnosis {
    margin-top: 10px;

async function uploadDataUrlToStorage(dataUrl, path) {

let allItems = [];
let typeFilter = 'all';
let statusFilter = 'all';

// ── UTIL ──────────────────────────────────────────
function showToast(msg, isError=false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('error', isError);
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function daysUntil(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr);
  if (isNaN(d)) return null;
  const now = new Date();
  return Math.ceil((d - now) / (1000 * 60 * 60 * 24));
}

function formatDate(dateStr) {
  if (!dateStr) return '—';
  const d = new Date(dateStr);
  if (isNaN(d)) return dateStr;
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function isExpiringSoon(item) {
  if (item.type !== 'pantry' || !item.expirationDate) return false;
  const d = daysUntil(item.expirationDate);
  return d !== null && d >= 0 && d <= 180;
}

function isExpired(item) {
  if (item.type !== 'pantry' || !item.expirationDate) return false;
  const d = daysUntil(item.expirationDate);
  return d !== null && d < 0;
}

function compressImage(file, maxDim = 1400, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) { height = Math.round(height * maxDim / width); width = maxDim; }
        else if (height > maxDim) { width = Math.round(width * maxDim / height); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ── FILTERS & RENDER ──────────────────────────────────────────
function setTypeFilter(t) {
  // Click same chip again to deselect (back to All)
  if (t === typeFilter && t !== 'all') t = 'all';
  typeFilter = t;
  visibleCount = PAGE_SIZE;
  document.querySelectorAll('.chip[data-type]').forEach(c => c.classList.toggle('active', c.dataset.type === t));
  renderCategoryChips();
  categoryFilter = 'all';
  filterAndRender();
}
function setStatusFilter(s) {
  if (s === statusFilter && s !== 'all') s = 'all';
  statusFilter = s;
  visibleCount = PAGE_SIZE;
  document.querySelectorAll('.chip[data-status]').forEach(c => c.classList.toggle('active', c.dataset.status === s));
  filterAndRender();
}
function setCategoryFilter(c) {
  if (c === categoryFilter && c !== 'all') c = 'all';
  categoryFilter = c;
  visibleCount = PAGE_SIZE;
  document.querySelectorAll('.chip[data-cat]').forEach(el => el.classList.toggle('active', el.dataset.cat === c));
  filterAndRender();
}
function resetFilters() {
  visibleCount = PAGE_SIZE;
  setTypeFilter('all');
  setStatusFilter('all');
  document.getElementById('searchInput').value = '';
  searchQuery = '';
  filterAndRender();
}
function loadMore() {
  visibleCount += PAGE_SIZE;
  filterAndRender();
}

function renderCategoryChips() {
  const relevant = typeFilter === 'all' ? allItems : allItems.filter(i => i.type === typeFilter);
  const cats = [...new Set(relevant.map(i => i.category).filter(Boolean))].sort();
  const wrap = document.getElementById('categoryChips');
  if (cats.length === 0) { wrap.innerHTML = ''; return; }
  wrap.innerHTML = '<span class="chip-label">Category:</span>' +
    `<button class="chip active" data-cat="all">All</button>` +
    cats.map(c => `<button class="chip" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join('');
  wrap.querySelectorAll('.chip[data-cat]').forEach(btn => {
    btn.addEventListener('click', () => setCategoryFilter(btn.dataset.cat));
  });
}

function matchesFilters(item) {
  if (typeFilter !== 'all' && item.type !== typeFilter) return false;
  if (categoryFilter !== 'all' && item.category !== categoryFilter) return false;
  if (statusFilter !== 'all') {
    if (statusFilter === 'expiring') { if (!isExpiringSoon(item)) return false; }
    else if (statusFilter === 'planted') { if (!(item.status === 'planted-indoor' || item.status === 'planted-outdoor')) return false; }
    else if (item.status !== statusFilter) return false;
  }
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    const hay = [item.name, item.category, item.variety, item.location, item.sublocation, item.vendor, item.purpose, item.notes, item.statusLabel, item.usedFor, (item.tags||[]).join(' ')]
      .filter(Boolean).join(' ').toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

function renderStats() {
  const total = allItems.length;
  const pantry = allItems.filter(i => i.type === 'pantry').length;
  const crops = allItems.filter(i => i.type === 'crop').length;
  const expiring = allItems.filter(isExpiringSoon).length;
  const needs = allItems.filter(i => i.status === 'need').length;
  document.getElementById('statsBar').innerHTML = `
    <div class="stat"><div class="stat-label">Total Items</div><div class="stat-value">${total}</div></div>
    <div class="stat"><div class="stat-label">Pantry</div><div class="stat-value">${pantry}</div></div>
    <div class="stat"><div class="stat-label">Crops</div><div class="stat-value">${crops}</div></div>
    <div class="stat"><div class="stat-label">Expiring &lt; 6mo</div><div class="stat-value ${expiring > 0 ? 'warn' : ''}">${expiring}</div></div>
    <div class="stat"><div class="stat-label">Need to Buy</div><div class="stat-value ${needs > 0 ? 'alert' : ''}">${needs}</div></div>
  `;
}

function statusBadge(item) {
  if (isExpired(item)) return `<span class="badge badge-expiring">Expired</span>`;
  if (isExpiringSoon(item)) {
    const d = daysUntil(item.expirationDate);
    return `<span class="badge badge-expiring">${d}d left</span>`;
  }
  if (item.status === 'have') return `<span class="badge badge-have">Have</span>`;
  if (item.status === 'need') return `<span class="badge badge-need">Need</span>`;
  if (item.status === 'dormant') return `<span class="badge badge-dormant">Dormant</span>`;
  if (item.status === 'planted-indoor') return `<span class="badge badge-planted">Planted indoor</span>`;
  if (item.status === 'planted-outdoor') return `<span class="badge badge-planted">Planted outdoor</span>`;
  if (item.status === 'not-planted') return `<span class="badge badge-dormant">Not planted</span>`;
  return '';
}

function renderCard(item) {
  const emoji = item.categoryEmoji || (item.type === 'pantry' ? '🥫' : item.type === 'crop' ? '🌱' : '🪴');
  const imgHtml = item.imageUrl
    ? `<img src="${escapeHtml(item.imageUrl)}" alt="" loading="lazy" onerror="this.style.display='none'">`
    : `<div class="card-image-placeholder">${emoji}</div>`;
  const loc = item.location ? `<div class="card-sub">📍 ${escapeHtml(item.location)}</div>` : '';
  const qty = item.quantity ? `<div class="card-sub">${escapeHtml(String(item.quantity))}</div>` : '';
  const variety = item.variety ? `<div class="card-sub" style="font-style:italic;">${escapeHtml(item.variety)}</div>` : '';
  const events = item.events ? Object.values(item.events) : [];
  const eventCount = events.length;
  const lastEvent = events.sort((a,b) => (b.at||0) - (a.at||0))[0];
  const lastEventHtml = lastEvent
    ? `<div class="card-sub" style="color:var(--sage);font-size:11px;">${eventEmoji(lastEvent.eventType)} ${escapeHtml(eventLabel(lastEvent.eventType))} · ${relativeTime(lastEvent.at)}</div>`
    : '';
  const quick = quickEventsFor(item.type);
  const quickLogHtml = quick.length ? `
    <div class="quick-log-row">
      ${quick.map(e => `<button class="quick-log-btn ${e.key==='diagnose'?'diagnose-btn':''}" title="${escapeHtml(e.label)}" onclick="event.stopPropagation(); ${e.key==='diagnose' ? `startDiagnose('${escapeHtml(item.id)}')` : `quickLog('${escapeHtml(item.id)}','${e.key}')`}">${e.emoji}</button>`).join('')}
    </div>
  ` : '';
  return `
    <div class="card" data-id="${escapeHtml(item.id)}">
      <div class="card-image" onclick="openDetail('${escapeHtml(item.id)}')">
        ${imgHtml}
        <div class="card-top-ribbon">
          <span class="badge badge-category">${emoji} ${escapeHtml(item.category || '')}</span>
        </div>
        <div class="card-top-right">${statusBadge(item)}</div>

      </div>
      <div class="card-body" onclick="openDetail('${escapeHtml(item.id)}')">
        <div class="card-name">${escapeHtml(item.name)}</div>
        ${variety}
        ${qty}
        ${loc}
        ${lastEventHtml}
      </div>
      ${quickLogHtml}
    </div>
  `;
}

function relativeTime(ms) {
  if (!ms) return '';
  const diff = Date.now() - ms;
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  const days = Math.floor(hrs / 24);
  if (days < 7) return `${days}d ago`;
  if (days < 30) return `${Math.floor(days/7)}w ago`;
  if (days < 365) return `${Math.floor(days/30)}mo ago`;
  return `${Math.floor(days/365)}y ago`;
}

// Attach drag-drop handlers to every card in the grid.
// Drop an image file onto a card to attach it as a photo (no modal needed).
function attachCardDropHandlers() {
  document.querySelectorAll('.card[data-id]').forEach(card => {
    card.addEventListener('dragover', e => {
      // Only highlight if there's a file or image being dragged
      const hasFile = e.dataTransfer && Array.from(e.dataTransfer.items || []).some(i => i.kind === 'file');
      if (!hasFile) return;
      e.preventDefault();
      e.stopPropagation();
      card.classList.add('drag-over');
    });
    card.addEventListener('dragleave', e => {
      card.classList.remove('drag-over');
    });
    card.addEventListener('drop', async e => {
      e.preventDefault();
      e.stopPropagation();
      card.classList.remove('drag-over');
      const files = Array.from(e.dataTransfer.files || []).filter(f => f.type.startsWith('image/'));
      if (!files.length) return;
      const id = card.dataset.id;
      const item = allItems.find(i => i.id === id);
      if (!item) return;
      await attachPhotosToItem(item, files);
    });
  });
}

// Upload a list of image Files, compress them, attach to item, push to Firebase.
async function attachPhotosToItem(item, files) {
  showToast(`Uploading ${files.length} photo${files.length === 1 ? '' : 's'} to ${item.name}...`);
  const photos = (item.photos || []).slice();
  const base = pathFor(item.type, item.id);
  const now = Date.now();
  let added = 0;
  for (let i = 0; i < files.length; i++) {
    try {
      const compressed = await compressImage(files[i]);
      const url = await uploadDataUrlToStorage(compressed, `${base}/photo-${now}-${i}.jpg`);
      photos.push(url);
      added++;
    } catch (err) { console.error('Photo upload failed', err); }
  }
  if (!added) { showToast('Upload failed', true); return; }
  const updates = {};
  updates[`${base}/photos`] = photos;
  if (!item.imageUrl) updates[`${base}/imageUrl`] = photos[0];
  updates[`${base}/lastUpdated`] = now;
  try {
    await update(ref(db, '/'), updates);
    showToast(`✓ Added ${added} photo${added === 1 ? '' : 's'} to ${item.name}`);
  } catch (e) { console.error(e); showToast('Save failed', true); }
}

async function saveEvent(item, { eventType, note, photos, aiDiagnosis }) {
  const eventId = `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 6)}`;
  const base = eventsPathFor(item.type, item.id);
  const evt = {
    id: eventId,
    eventType,
    at: Date.now(),
    note: note || null,
    photos: photos || [],
  };
  if (aiDiagnosis) evt.aiDiagnosis = aiDiagnosis;
  const updates = {};
  updates[`${base}/${eventId}`] = evt;
  updates[`${pathFor(item.type, item.id)}/lastUpdated`] = Date.now();
  await update(ref(db, '/'), updates);
  return evt;
}

async function deleteEvent(itemId, eventId) {

// ── AI DIAGNOSE (Claude Vision) ──────────────────────────────────────────
// User takes/picks a photo → we upload it → call askAI with vision → save an event with the diagnosis.
async function startDiagnose(itemId) {
  const item = allItems.find(i => i.id === itemId);
  if (!item) return;
  // Open native file picker immediately
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.multiple = false;
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    await runDiagnose(item, file);
  };
  input.click();
}

async function runDiagnose(item, file) {
  showToast('📸 Uploading photo & asking Claude Vision…');
  let photoUrl;
  try {
    const compressed = await compressImage(file);
    const ts = Date.now();
    photoUrl = await uploadDataUrlToStorage(compressed, `${pathFor(item.type, item.id)}/events/diagnose-${ts}.jpg`);
  } catch (e) {
    console.error(e); showToast('Photo upload failed', true); return;
  }

  const system = `You are a plant-health specialist for Philinity (Boise foothills, USDA zone 6b/7a). You analyze photos of ${item.type === 'crop' ? 'crops/plants' : item.type === 'pantry' ? 'pantry items' : 'accessories'} and give honest, Boise-appropriate diagnostics. Be direct and specific.

Today: ${new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' })}

Context about this item:
- Name: ${item.name}
${item.variety ? `- Variety: ${item.variety}` : ''}
${item.location ? `- Location: ${item.location}${item.sublocation ? ' / ' + item.sublocation : ''}` : ''}
${item.plantedDate ? `- Planted: ${item.plantedDate}` : ''}
${item.purpose ? `- Purpose: ${item.purpose}` : ''}
${item.notes ? `- Notes: ${item.notes}` : ''}

Structure your response:
1. **Observation** — what you see in the photo (concise)
2. **Likely diagnosis** — pest/disease/deficiency/stress ranked by probability
3. **Recommended action** — specific, Boise-appropriate, closed-loop preferred
4. **Flags** — anything urgent or irreversible

Keep response under 300 words. No fluff.`;

  const userMsg = {
    role: 'user',
    content: [
      { type: 'image', source: { type: 'url', url: photoUrl } },
      { type: 'text', text: `Please diagnose this photo of my ${item.name}${item.variety ? ' (' + item.variety + ')' : ''}.` },
    ],
  };

  try {
    const user = auth.currentUser;
    const idToken = await user.getIdToken();
    const res = await fetch('https://us-central1-philinity-893d2.cloudfunctions.net/askAI', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + idToken },
      body: JSON.stringify({ app: 'foodswipe', system, messages: [userMsg] }),
    });
    if (!res.ok) {
      const errText = await res.text();
      showToast('Diagnose failed: ' + errText, true);
      return;
    }
    const data = await res.json();
    const diagnosis = (data.content || []).filter(c => c.type === 'text').map(c => c.text).join('\n');
    if (!diagnosis) { showToast('Diagnose returned empty', true); return; }

    await saveEvent(item, {
      eventType: 'diagnose',
      note: null,
      photos: [photoUrl],
      aiDiagnosis: diagnosis,
    });
    showToast('🩺 Diagnosis saved to timeline');
    // If detail open, refresh
    const fresh = allItems.find(i => i.id === item.id);
    if (fresh && document.getElementById('modalRoot')) renderDetailModal(fresh);
  } catch (e) {
    console.error(e);
    showToast('Diagnose error: ' + e.message, true);
  }
}

    try {
      const compressed = await compressImage(f);
      pendingPhotos.push({ compressed });

  }
  renderPendingPhotos();
}

// Paste handler — works for the Add/Edit modal (photoDropzone), the Event modal
// (evDropzone), and the Detail modal (detailImageArea). Screenshots and copied
// images from anywhere paste directly.
document.addEventListener('paste', async e => {
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  const files = [];
  for (const it of items) {
    if (it.kind === 'file' && it.type.startsWith('image/')) {
      const f = it.getAsFile();
      if (f) files.push(f);
    }
  }
  if (!files.length) return;

  // Event modal (most specific — check first)
  if (document.getElementById('evDropzone')) {
    e.preventDefault();
    await ingestEventPhotoFiles(files);
    showToast('📋 Image pasted');
    return;
  }
  // Add/Edit modal
  if (document.getElementById('photoDropzone')) {
    e.preventDefault();
    await ingestPhotoFiles(files);
    showToast('📋 Image pasted');
    return;
  }
  // Detail modal
  const area = document.getElementById('detailImageArea');
  if (area) {
    e.preventDefault();
    const id = area.dataset.id;
    const target = allItems.find(i => i.id === id);
    if (!target) return;
    closeModal();
    await attachPhotosToItem(target, files);
    return;
  }
});

  const now = Date.now();
  const existing = editingId ? allItems.find(i => i.id === editingId) : null;
  const newType = get('f_type');
  const newId = editingId || makeId(name, newType);

  const photos = existing ? (existing.photos || []).slice() : [];
  if (pendingPhotos.length) {

      const path = `${PATH}/${collectionFor(newType)}/${newId}/photo-${now}-${i}.jpg`;
      try {

        photos.push(url);
      } catch (e) { console.error('Photo upload failed', e); showToast('Photo upload failed', true); }

  }

  const entry = {
    id: newId,
    type: get('f_type'),
    name,
    category: get('f_category') || null,
    categoryEmoji: get('f_emoji') || null,
    variety: get('f_variety') || null,
    location: get('f_location') || null,
    sublocation: get('f_sublocation') || null,
    quantity: get('f_quantity') || null,
    price: get('f_price') ? parseFloat(get('f_price')) : null,
    status: get('f_status'),
    vendor: get('f_vendor') || null,

    plantingWindow: get('f_plantingWindow') || null,
    purpose: get('f_purpose') || null,
    url: get('f_url') || null,
    notes: get('f_notes') || null,
    photos,

    tags: existing ? (existing.tags || []) : [],
    createdAt: existing ? existing.createdAt : now,
    lastUpdated: now,
  };

  try {

function makeId(name, type) {
  let base = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 50);
  if (!base) base = 'item';
  // Check for collision inside the same collection only
  const existing = new Set(allItems.filter(i => i.type === type).map(i => i.id));
  if (!existing.has(base)) return base;
  let n = 2;
  while (existing.has(`${base}-${n}`)) n++;
  return `${base}-${n}`;
}

// Extract top-level JSON objects from text using brace counting.
// Returns strings that look like JSON (contain "action" or "actions").
function extractJsonBlocks(text) {
  const blocks = [];
  let depth = 0, start = -1, inString = false, escape = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (escape) { escape = false; continue; }
    if (ch === '\\') { escape = true; continue; }
    if (ch === '"') { inString = !inString; continue; }
    if (inString) continue;
    if (ch === '{') { if (depth === 0) start = i; depth++; }
    else if (ch === '}') {
      depth--;
      if (depth === 0 && start !== -1) {
        const candidate = text.slice(start, i + 1);
        if (/"action"\s*:|"actions"\s*:/.test(candidate)) blocks.push(candidate);
        start = -1;
      }
      if (depth < 0) depth = 0; // recover from unbalanced text
    }
  }
  return blocks;
}

}

6. Update any item: {"action":"update","id":"<exact-id-from-context>","data":{...fields...}}
7. Multiple actions: {"actions":[{...},{...}]}

RULES:
- Use exact [id:xxx] from context — never invent IDs

- When asked to add something that may already exist, flag the potential duplicate first.`;

  try {

function downloadCSV() {
  if (!allItems.length) { showToast('No items to export', true); return; }
  const cols = ['type','name','category','variety','location','sublocation','quantity','price','status','vendor','purchaseDate','expirationDate','plantedDate','shelfLifeYears','plantingWindow','purpose','usedFor','url','notes'];
  const header = cols.join(',');

    if (v == null) return '';
    let s = String(v).replace(/"/g, '""');
    if (/[",\n]/.test(s)) s = `"${s}"`;
    return s;
  };
  const rows = allItems.map(i => cols.map(c => esc(i[c])).join(','));
  const csv = [header, ...rows].join('\n');
  const stamp = new Date().toISOString().split('T')[0];
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `foodswipe-${stamp}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  showToast('✓ CSV downloaded');
}

async function restoreFromBackup(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  const fn = document.getElementById('restoreFilename');
  if (fn) fn.textContent = file.name;
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      let data = JSON.parse(e.target.result);
      // Accept either {foodswipe:{pantry:{}, crops:{}, ...}} or just {pantry:{}, crops:{}, ...}
      if (data.foodswipe) data = data.foodswipe;

      let count = 0;
      if (data.pantry) count += Object.keys(data.pantry).length;
      if (data.crops) count += Object.keys(data.crops).length;
      if (data.accessories) count += Object.keys(data.accessories).length;

      if (!count) { showToast('Backup file has no items', true); return; }

      if (!confirm(`Restore ${count} items from "${file.name}"?\n\nExisting items with the same IDs will be OVERWRITTEN. New items will be ADDED. Items in Firebase that aren't in the backup will remain.`)) {
        ev.target.value = '';
        return;
      }

      const updates = {};
      ['pantry','crops','accessories'].forEach(col => {
        if (data[col]) {
          Object.entries(data[col]).forEach(([id, item]) => {
            updates[`${PATH}/${col}/${id}`] = item;
          });
        }
      });
      await update(ref(db, '/'), updates);
      showToast(`✓ Restored ${count} items`);
      const s = document.getElementById('dataStatus');
      if (s) s.textContent = `✓ Restored ${count} items from ${file.name}`;
    } catch (err) {
      console.error(err);
      showToast('Restore failed: ' + err.message, true);
    }
    ev.target.value = '';
  };
  reader.readAsText(file);
}
